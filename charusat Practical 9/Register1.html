
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHARUSAT Registration</title>
    <link rel="stylesheet" href="Register.css">
    <link rel="stylesheet" href="darktheme.css">
</head>
<body>

<button type="button" id="themeBtn">Dark Mode</button>

<header>
    <h1>CHARUSAT Student Portal</h1>
    <p>Everything you need for your academic journey in one place.</p>
    <hr>
</header>

<h1>Register</h1>

<form action="register.php" method="POST" id="registrationForm">

    <label for="name">Name:</label>
    <input type="text" id="name" name="name"
           minlength="2" maxlength="50" required>
    <br><br>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username"
           minlength="3" maxlength="50"
           pattern="[A-Za-z0-9_]+"
           title="Use letters, numbers, and underscores only"
           required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           maxlength="254" required>
    <br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile"
           pattern="[6-9][0-9]{9}" maxlength="10"
           inputmode="numeric"
           title="Enter a valid 10-digit Indian mobile number"
           required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password"
           minlength="8" maxlength="72"
           autocomplete="new-password" required>
    <br><br>

    <label for="confirmPassword">Confirm Password:</label>
    <input type="password" id="confirmPassword"
           name="confirmPassword" minlength="8" maxlength="72"
           autocomplete="new-password" required>
    <br><br>

    <label for="course">Course:</label>
    <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="B.Tech">B.Tech</option>
        <option value="MCA">MCA</option>
        <option value="MBA">MBA</option>
    </select>
    <br><br>

    <label for="year">Year:</label>
    <select id="year" name="year" required>
        <option value="">Select Year</option>
        <option value="1">First Year</option>
        <option value="2">Second Year</option>
        <option value="3">Third Year</option>
        <option value="4">Fourth Year</option>
    </select>
    <br><br>

    <label>Gender:</label>
    <input type="radio" id="male" name="gender"
           value="Male" required>
    <label for="male" class="option-label">Male</label>

    <input type="radio" id="female" name="gender" value="Female">
    <label for="female" class="option-label">Female</label>

    <input type="radio" id="other" name="gender" value="Other">
    <label for="other" class="option-label">Other</label>
    <br><br>

    <input type="checkbox" id="terms" name="terms"
           value="accepted" required>
    <label for="terms" class="terms-label">
        I accept the Terms and Conditions
    </label>
    <br><br>

    <p id="formMessage" role="alert" aria-live="polite"></p>

    <button type="submit">Register</button>

    <a href="Login.html">
        <button type="button">Already Registered? Login here</button>
    </a>

</form>

<footer>
    <p>© 2026 CHARUSAT Student Portal. All rights reserved.</p>
</footer>

<script src="Register1.js"></script>
<script src="darktheme.js"></script>

</body>
</html>
